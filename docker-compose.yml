name: samasignal
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-samasignal}
      POSTGRES_USER: ${POSTGRES_USER:-samasignal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./apps/api
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_DB: ${POSTGRES_DB:-samasignal}
      POSTGRES_USER: ${POSTGRES_USER:-samasignal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMMA_MODEL: ${GEMMA_MODEL:-gemma-4-26b-a4b-it}
      AI_MODE: ${AI_MODE:-disabled}
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8081"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
  web:
    build: ./apps/web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  uploads:
