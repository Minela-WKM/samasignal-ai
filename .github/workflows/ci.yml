name: CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e
          path: |
            apps/web/playwright-report
            apps/web/test-results

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            tools/sama-a11y/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm ci --prefix tools/sama-a11y
      - run: npx --prefix apps/web playwright install --with-deps chromium
      - name: Audit input, correction and dashboard (synthetic API)
        run: |
          npm --prefix apps/web run dev -- --port 5173 --strictPort > /tmp/samasignal-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          node tools/sama-a11y/cli.mjs http://127.0.0.1:5173 --prepare apps/web/e2e/a11y-scenario.mjs --output reports/sama-a11y
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sama-a11y
          path: reports/sama-a11y

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp verify

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 240
      - name: Verify web, API and reverse proxy
        run: |
          curl --fail http://localhost:8080/ | grep 'SamaSignal'
          curl --fail http://localhost:8081/actuator/health | grep 'UP'
          curl --fail http://localhost:8080/actuator/health | grep 'UP'
          curl --fail http://localhost:8080/swagger-ui/index.html > /dev/null
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
