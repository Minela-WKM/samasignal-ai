# Les services héritent de la branche choisie à la création du Blueprint.
# Tester avec feature/render-deployment ; basculer vers main après revue et CI verte.
services:
  - type: web
    name: samasignal-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: PORT
        value: "10000"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=65.0 -XX:+UseSerialGC -Xss512k"
      - key: POSTGRES_HOST
        fromDatabase: {name: sma-signalement, property: host}
      - key: POSTGRES_PORT
        fromDatabase: {name: sma-signalement, property: port}
      - key: POSTGRES_DB
        fromDatabase: {name: sma-signalement, property: database}
      - key: POSTGRES_USER
        fromDatabase: {name: sma-signalement, property: user}
      - key: POSTGRES_PASSWORD
        fromDatabase: {name: sma-signalement, property: password}
      - key: PUBLIC_API_HOST
        fromService: {name: samasignal-api, type: web, envVarKey: RENDER_EXTERNAL_HOSTNAME}
      - key: AI_MODE
        value: disabled
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
  - type: web
    name: samasignal-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: "10000"
      - key: API_SCHEME
        value: https
      - key: API_HOST
        fromService: {name: samasignal-api, type: web, envVarKey: PUBLIC_API_HOST}
databases:
  - name: sma-signalement
    # Nom SQL généré pour une nouvelle base ; nom existant conservé sinon.
    # L'API récupère le nom effectif via fromDatabase.
    postgresMajorVersion: "17"
    plan: free
    region: frankfurt
    ipAllowList: []
